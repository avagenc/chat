_format_version: "3.0"

services:
  - name: nayo-mock-service
    url: http://localhost
    routes:
      - name: nayo-route
        paths:
          - /nayo
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
          header_names:
            - Authorization
          cookie_names:
            - sb-access-token
      - name: pre-function
        config:
          access:
            - "require('enforcer')()"
      - name: request-termination
        config:
          status_code: 200
          content_type: "application/json"
          body: '{"message": "successfully hit nayo!", "service": "nayo"}'

  - name: tuya-mock-service
    url: http://localhost
    routes:
      - name: tuya-route
        paths:
          - /tuya
        strip_path: true
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
          header_names:
            - Authorization
          cookie_names:
            - sb-access-token
      - name: pre-function
        config:
          access:
            - "require('enforcer')()"
      - name: request-termination
        config:
          status_code: 200
          content_type: "application/json"
          body: '{"message": "successfully hit tuya!", "service": "tuya"}'

consumers:
  - username: supabase-auth-consumer
    jwt_secrets:
      - key: ${SUPABASE_KID}
        algorithm: ES256
        public_key: ${SUPABASE_PUBLIC_KEY}
