name: Deploy

on:
  push:
    branches: ["main", "dev"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: asia-southeast1
      REPO_NAME: docker
      SERVICE_NAME: chat-http
      IMAGE_NAME: chat-http
      APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Validate Deploy Configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_RUNTIME_SA_EMAIL: ${{ vars.GCP_RUNTIME_SA_EMAIL }}
          HOST_URL: ${{ vars.HOST_URL }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TUYA_ACCESS_ID: ${{ vars.TUYA_ACCESS_ID }}
          TUYA_ACCESS_SECRET: ${{ secrets.TUYA_ACCESS_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          CORS_ALLOWED_ORIGIN: ${{ vars.CORS_ALLOWED_ORIGIN }}
          OAUTH_STATE_SECRET: ${{ secrets.OAUTH_STATE_SECRET }}
          POSTERA_DB_URL: ${{ secrets.POSTERA_DB_URL }}
          POSTERA_API_KEY: ${{ secrets.POSTERA_API_KEY }}
          WALLET_DB_URL: ${{ secrets.WALLET_DB_URL }}
          THIRD_PARTY_API_KEY: ${{ secrets.THIRD_PARTY_API_KEY }}
        run: |
          missing=0
          for name in GCP_SA_KEY GCP_PROJECT_ID GCP_RUNTIME_SA_EMAIL HOST_URL \
            ZEP_API_KEY GEMINI_API_KEY TUYA_ACCESS_ID TUYA_ACCESS_SECRET \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET SPOTIFY_CLIENT_ID \
            SPOTIFY_CLIENT_SECRET WEB_APP_URL CORS_ALLOWED_ORIGIN \
            OAUTH_STATE_SECRET POSTERA_DB_URL POSTERA_API_KEY WALLET_DB_URL \
            THIRD_PARTY_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty — set it as a secret/variable in the '${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}' GitHub environment"
              missing=1
            fi
          done
          exit $missing

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        env:
          IMAGE_URL: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 \
            -t $IMAGE_URL --push .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Migrate Wallet Database
        env:
          WALLET_DB_URL: ${{ secrets.WALLET_DB_URL }}
        run: |
          go run github.com/pressly/goose/v3/cmd/goose@v3.27.2 \
            -dir wallet/migrations \
            postgres "$WALLET_DB_URL" up

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --allow-unauthenticated
            --memory=128Mi
            --cpu=1
            --min-instances=0
            --max-instances=1
            --cpu-boost
            --service-account=${{ vars.GCP_RUNTIME_SA_EMAIL }}
          env_vars: |
            APP_ENV=${{ env.APP_ENV }}
            HOST_URL=${{ vars.HOST_URL }}
            ZEP_API_KEY=${{ secrets.ZEP_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            TUYA_ACCESS_ID=${{ vars.TUYA_ACCESS_ID }}
            TUYA_ACCESS_SECRET=${{ secrets.TUYA_ACCESS_SECRET }}
            TUYA_BASE_URL=https://openapi.tuyaus.com
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            SPOTIFY_CLIENT_ID=${{ vars.SPOTIFY_CLIENT_ID }}
            SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
            WEB_APP_URL=${{ vars.WEB_APP_URL }}
            CORS_ALLOWED_ORIGIN=${{ vars.CORS_ALLOWED_ORIGIN }}
            OAUTH_STATE_SECRET=${{ secrets.OAUTH_STATE_SECRET }}
            FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            FIRESTORE_DATABASE_ID=(default)
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            CLOUD_TASKS_LOCATION_ID=${{ env.REGION }}
            CLOUD_TASKS_QUEUE_ID=postera
            POSTERA_DB_URL=${{ secrets.POSTERA_DB_URL }}
            POSTERA_API_KEY=${{ secrets.POSTERA_API_KEY }}
            WALLET_DB_URL=${{ secrets.WALLET_DB_URL }}
            THIRD_PARTY_API_KEY=${{ secrets.THIRD_PARTY_API_KEY }}
