name: Deploy

on:
  push:
    branches: ["main", "dev"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-southeast1
      REPO_NAME: docker
      SERVICE_NAME: gateway
      IMAGE_NAME: gateway

    environment: ${{ env.TARGET_ENV }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        env:
          IMAGE_URL: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $IMAGE_URL .
          docker push $IMAGE_URL

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: "--allow-unauthenticated --memory=512Mi --cpu=1 --min-instances=1 --max-instances=10 --cpu-boost --port 8080"

          env_vars: |
            APP_ENV=${{ env.TARGET_ENV }}
            AVAGENC_IDENTITY_SUPABASE_JWKS_URL=${{ vars.AVAGENC_IDENTITY_SUPABASE_JWKS_URL }}
            AVAGENC_NAYO_SERVICE_URL=${{ vars.AVAGENC_NAYO_SERVICE_URL }}

          secrets: |
            REDIS_URL=GATEWAY_REDIS_READ_ONLY_URL:latest
            AVAGENC_API_KEY=AVAGENC_API_KEY:latest
