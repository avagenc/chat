name: Deploy

on:
  push:
    branches: ["main", "dev"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: asia-southeast1
      REPO_NAME: docker
      SERVICE_NAME: chat-api
      IMAGE_NAME: chat-api
      APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        env:
          IMAGE_URL: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $IMAGE_URL .
          docker push $IMAGE_URL

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --allow-unauthenticated
            --memory=128Mi
            --cpu=1
            --min-instances=0
            --max-instances=1
            --cpu-boost
            --service-account=${{ vars.GCP_SA_EMAIL }}

          env_vars: |
            APP_ENV=${{ env.APP_ENV }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            TUYA_BASE_URL=${{ vars.TUYA_BASE_URL }}
            CLOUD_TASKS_LOCATION_ID=${{ env.REGION }}
            CLOUD_TASKS_QUEUE_ID=ava
            GCP_RUNTIME_SA_EMAIL=${{ vars.GCP_SA_EMAIL }}
            HOST_URL=${{ vars.HOST_URL }}
            ZEP_API_KEY=${{ secrets.ZEP_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            TUYA_ACCESS_ID=${{ secrets.TUYA_ACCESS_ID }}
            TUYA_ACCESS_SECRET=${{ secrets.TUYA_ACCESS_SECRET }}
            ZEE_DB_URL=${{ secrets.ZEE_DB_URL }}
            POSTERA_DB_URL=${{ secrets.POSTERA_DB_URL }}
